            border-bottom: 0.5px solid rgba(255, 255, 255, 0.05);

            background: linear-gradient(90deg, #b7f646, #d0ff82);
            box-shadow: 0 0 15px rgba(208, 255, 130, 0.4);
        }
        
        .btn-3d {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2), 0 4px 15px rgba(208, 255, 130, 0.3);
            transition: all 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn-3d:hover {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2), 0 8px 25px rgba(208, 255, 130, 0.5);
            transform: translateY(-2px);
        }
        
        .btn-3d:active {
            transform: scale(0.97);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 2px 10px rgba(208, 255, 130, 0.2);
        }

        .scanner-ring {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px dashed #424936;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(35, 31, 22, 0.5);
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #d0ff82;
            box-shadow: 0 0 10px #d0ff82, 0 0 20px #d0ff82;
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
            z-select: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;

                radial-gradient(circle at 85% 30%, rgba(233, 195, 73, 0.05), transparent 25%);
        }
